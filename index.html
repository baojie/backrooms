<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>后室 / The Backrooms</title>
<link rel="stylesheet" href="css/main.css">
</head>
<body>

<div id="hud">
  <div>体力 (Stamina)</div>
  <div class="bar"><div class="fill" id="staminaFill" style="width:100%"></div></div>
  <div style="margin-top:6px">理智 (Sanity)</div>
  <div class="bar"><div class="fill sanity" id="sanityFill" style="width:100%"></div></div>
  <div style="margin-top:6px">生命 (HP) <span id="hpNum" style="opacity:.85">10000 / 10000</span></div>
  <div class="bar"><div class="fill hp" id="hpFill" style="width:100%"></div></div>
  <div style="margin-top:8px" id="distance">行程：0 米</div>
</div>

<div id="floorTag">第 1 层</div>
<div id="team"></div>

<div id="vignette"></div>
<div id="flash"></div>
<div id="subtitle"></div>
<div id="floorTitle"></div>


<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { PointerLockControls } from 'three/addons/controls/PointerLockControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { FBXLoader } from 'three/addons/loaders/FBXLoader.js';
import * as SkeletonUtils from 'three/addons/utils/SkeletonUtils.js';

// Refactored modules
import { LEVELS, CELL, GRID, WALL_HEIGHT, TEAM_SIZE, GIRL_NAMES } from './js/levels.js';
import { makeNoiseTexture, makeWallpaperTexture, makeCarpetTexture, makeCeilingTileTexture } from './js/textures.js';
import {
  initAudio, blip, playStatic, heartbeat,
  playDeathCry as _playDeathCry,
  getAudioCtx, getHumGain, getLastHeart, setLastHeart,
} from './js/audio.js';
import {
  say, speak, whispers, setCompanions as _setCompanionsForTTS, tickSubtitle, getSubTimer,
} from './js/tts.js';
import { pickCompanionLine, COMPANION_LINES_GENERIC } from './js/lines.js';
import { buildKnifeMesh } from './js/weapons.js';
import { setupWeapons } from './js/weapons_setup.js';
import { buildCompanionRoster } from './js/companion_roster.js';
import { MAX_HP, createPlayerState, createSetWeapon } from './js/player_state.js';
import {
  loadCharacters, isSoldierLoaded, isGirlLoaded, getButterflyProto,
  makeNameTag, attachCompanionKnife,
  buildProceduralCompanion, buildHumanoidEntity,
  buildGLTFGirl, buildSoldierEntity, buildCompanionMesh,
} from './js/characters/index.js';
import { findPathBFS, updateGuide as _updateGuide } from './js/guide.js';
import { createWeaponFX } from './js/weapon_fx.js';
import { createCompanionAI } from './js/companion_ai.js';
import { maybeRunScreenshotMode } from './js/screenshot_mode.js';
import { createScene } from './js/scene.js';
import { makeCollider } from './js/collision.js';
import { setupOverlay } from './js/overlay.js';
import { createElevator } from './js/elevator.js';
import { leaveCorpse, createInteract } from './js/interact.js';
import { setupInput } from './js/input.js';
import { createHazards } from './js/hazards.js';
import { createEntities } from './js/entities.js';
import { createPlayer } from './js/player.js';
import { createPickups } from './js/pickups.js';
import { createWeaponAnim } from './js/weapon_anim.js';
import { createAtmosphere } from './js/atmosphere.js';
import { createHUD } from './js/hud.js';
import { createLevelBuilder } from './js/level.js';
import { setupOverlayDOM } from './js/dom_setup.js';

// Build the four full-screen overlays (welcome / death / win / elevator)
// before any module looks them up via getElementById.
setupOverlayDOM();

// Bridge: audio's death cry needs the TTS speak callback
function playDeathCry(c) { _playDeathCry(c, speak); }
// Capture-phase + pointerdown/keydown so the AudioContext starts even when
// the start-button click handler calls stopPropagation().
addEventListener('pointerdown', initAudio, { once: true, capture: true });
addEventListener('keydown',     initAudio, { once: true, capture: true });


// ============================================================
// Setup — see js/scene.js for renderer / camera / controls / flashlight.
// ============================================================
const { scene, renderer, camera, controls, flashlight } = createScene();


// ============================================================
// Level state
// ============================================================

let levelGroup = null;
let wallBoxes = [];
let wallMeshRef = null;       // current level's instanced wall mesh
let rockets = [];             // active rocket projectiles
let lights = [];
let almonds = [];
let knives = [];
let medkits = [];          // first-aid pickups — restore HP on contact
let entities = [];
let electricZones = [];   // live-wire hazards on flooded levels — instant kill on contact
let toxicZones = [];      // sickly-green water patches — slow damage on contact
let boats = [];           // boardable boats on flooded levels
let moths = [];           // fluttering moths — drain hp on contact, killable with insecticide
let stairExit = null;
let randomStair = null;    // bonus staircase that warps to a random other floor
let elevator = null;
let pool = null;           // sunken pool footprint on the swimming-pool level
let guide = null;          // kind-stranger NPC that leads the player to the exit
let currentLevel = 0;
let cells = [];

// ============================================================
// Player + companions
// ============================================================
const player = createPlayerState(THREE);

// Held-weapon pivots + WEAPONS table — see js/weapons_setup.js.
const { WEAPONS, WEAPON_ORDER, heldKnifePivot } = setupWeapons(camera);
const setWeapon = createSetWeapon({ player, WEAPONS, WEAPON_ORDER, say });

// Companion roster (10 girls, golden-angle palette) — see js/companion_roster.js.
const companions = buildCompanionRoster(TEAM_SIZE, GIRL_NAMES);
// Register the companion roster with the TTS module so it can mark `talking`.
_setCompanionsForTTS(companions);

// ============================================================
// Web-resourced humanoid models (loaded by js/characters.js).
//   Soldier.glb            → male NPCs (the hostile entities)
//   Capoeira-girl FBX      → girl team members (with Ginga sway)
//   Butterfly (Poly Pizza) → moths on the swimming-pool level
// ============================================================
loadCharacters({
  onSoldierReady: () => upgradeEntitiesToGLTF(),
  onGirlReady:    () => scheduleGLTFUpgrade(),
});




// Level builder + disposer + spawnProps wrapper + showFloorTitle —
// see js/level.js. We keep the `let` bindings for the singletons here so
// other modules' getters (() => stairExit, etc.) keep resolving the
// current value; level.js calls the set* callbacks each time it (re)
// assigns one.
const _level = createLevelBuilder({
  scene, camera, controls, player,
  LEVELS, GRID, CELL, WALL_HEIGHT,
  wallBoxes, lights, almonds, knives, medkits, entities, rockets,
  electricZones, toxicZones, boats, moths, companions,
  setLevelGroup:    (v) => { levelGroup    = v; },
  setWallMeshRef:   (v) => { wallMeshRef   = v; },
  setStairExit:     (v) => { stairExit     = v; },
  setRandomStair:   (v) => { randomStair   = v; },
  setElevator:      (v) => { elevator      = v; },
  setPool:          (v) => { pool          = v; },
  setGuide:         (v) => { guide         = v; },
  setCurrentLevel:  (v) => { currentLevel  = v; },
  setCells:         (v) => { cells         = v; },
  getLevelGroup:    () => levelGroup,
  getCells:         () => cells,
  makeNoiseTexture, makeWallpaperTexture, makeCarpetTexture, makeCeilingTileTexture,
  buildKnifeMesh,
  buildCompanionMesh, attachCompanionKnife, makeNameTag, buildProceduralCompanion,
  buildSoldierEntity, buildHumanoidEntity,
  isSoldierLoaded, getButterflyProto,
  scheduleGLTFUpgrade, upgradeEntitiesToGLTF,
  speak,
});
const { buildLevel, disposeLevel } = _level;

// ============================================================
// Input
// ============================================================
const keys = {};
// Elevator UI + transition (see js/elevator.js).
const _elev = createElevator({
  LEVELS, controls,
  getElevator: () => elevator,
  getCurrentLevel: () => currentLevel,
  buildLevel,
  blip, say, speak,
});
const isElevatorOpen = _elev.isOpen;
const closeElevator  = _elev.close;
const gotoFloor      = _elev.gotoFloor;
const tryEnterElevator = _elev.tryEnter;
const tickElevator     = _elev.tickElevator;
const isElevatorInTransition = _elev.isInTransition;

// Interact (E key) + leaveCorpse helper (see js/interact.js).
const tryInteract = createInteract({
  LEVELS, controls, player,
  getBoats:       () => boats,
  getElevator:    () => elevator,
  getStairExit:   () => stairExit,
  getRandomStair: () => randomStair,
  getCurrentLevel: () => currentLevel,
  buildLevel,
  tryEnterElevator, isElevatorInTransition,
  say, speak, blip,
  getWinScreen: () => winScreen,
});

// Overlays / restart (see js/overlay.js).
const { startGame, resetAll, overlay, deathScreen, winScreen } = setupOverlay({
  controls, camera, player, companions, MAX_HP,
  setWeapon, buildLevel, isElevatorOpen,
});


// Collision (see js/collision.js).
const collide = makeCollider({ getWallBoxes: () => wallBoxes, GRID, CELL });

// ============================================================
// Game loop
// ============================================================
const clock = new THREE.Clock();
const flashEl = document.getElementById('flash');

// Bind the weapon-firing helpers to the live game state. The closure
// captures references to the mutable arrays (entities, companions, etc.)
// so in-place mutations are visible to both sides; `levelGroup` and
// `wallMeshRef` are dereffed via getters because they're rebuilt on each
// level transition.
const _wfx = createWeaponFX({
  WEAPONS, GRID, CELL, WALL_HEIGHT,
  player, camera, controls, flashEl,
  entities, companions, wallBoxes, rockets, moths,
  getLevelGroup: () => levelGroup,
  getWallMeshRef: () => wallMeshRef,
  blip, playStatic, say, initAudio,
  playDeathCry, leaveCorpse,
});
const { useWeapon, fireGun, fireRocket, sprayInsecticide,
        trySwingKnife, explode, destroyWallsAt, tickRockets } = _wfx;

// Companion AI + GLTF upgrade scheduler. Same closure pattern: arrays
// captured by reference, levelGroup re-derived on each call.
const _ai = createCompanionAI({
  THREE, controls,
  entities, companions,
  getLevelGroup: () => levelGroup,
  getPool: () => pool,
  isSoldierLoaded, isGirlLoaded,
  buildSoldierEntity, buildGLTFGirl, attachCompanionKnife,
  collide, blip, say, speak,
  pickCompanionLine, getCurrentLevel: () => currentLevel, MAX_HP, player,
});
const { updateCompanions, tickCompanionChatter, upgradeEntitiesToGLTF,
        scheduleGLTFUpgrade, isGLTFUpgradeComplete } = _ai;

// Keyboard + mouse input (see js/input.js). The same `keys` map is
// passed in so the listeners and the tick() loop share one reference.
setupInput({
  LEVELS, WEAPON_ORDER, controls, player, keys,
  overlay, deathScreen, winScreen,
  isElevatorOpen, closeElevator, gotoFloor,
  startGame, tryInteract,
  setWeapon, useWeapon,
});

// Pool-floor hazards (electric / moths / toxic) — see js/hazards.js.
const { updateElectric, updateMoths, updateToxic } = createHazards({
  GRID, CELL,
  controls, player, deathScreen, flashEl,
  getCompanions: () => companions,
  getElectricZones: () => electricZones,
  getToxicZones:    () => toxicZones,
  getMoths:         () => moths,
  leaveCorpse, playDeathCry, playStatic,
  say, speak,
});

// Hostile entity AI (per-frame chase + animation) — see js/entities.js.
const tickEntities = createEntities({
  controls, player, deathScreen, flashEl,
  getEntities:  () => entities,
  getCompanions: () => companions,
  getWallBoxes:  () => wallBoxes,
  leaveCorpse, playDeathCry, playStatic,
  say, speak,
});

// Player update (wake-up / movement / flashlight / death) — see js/player.js.
const { updatePlayerWakeup, updatePlayerMovement, updatePlayerDeath } = createPlayer({
  controls, camera, flashlight, flashEl, deathScreen,
  player, keys,
  getPool:       () => pool,
  getLevelGroup: () => levelGroup,
  collide,
  playStatic,
  buildProceduralCompanion, leaveCorpse,
});

// Pickups + held-weapon animation — see js/pickups.js, js/weapon_anim.js.
const updatePickups = createPickups({
  controls, player, MAX_HP, heldKnifePivot,
  getLevelGroup: () => levelGroup,
  getAlmonds:    () => almonds,
  getKnives:     () => knives,
  getMedkits:    () => medkits,
  say, blip,
});
const updateWeaponAnim = createWeaponAnim({
  WEAPONS, controls, player, heldKnifePivot,
  fireGun, sprayInsecticide,
});

// Atmosphere — see js/atmosphere.js.
const updateAtmosphere = createAtmosphere({
  THREE,
  controls, player, MAX_HP,
  getEntities:    () => entities,
  getLights:      () => lights,
  getStairExit:   () => stairExit,
  getRandomStair: () => randomStair,
  whispers,
  getAudioCtx, getHumGain, getLastHeart, setLastHeart, heartbeat,
  say, speak,
});

// HUD bars + interact prompts — see js/hud.js.
const updateHUD = createHUD({
  LEVELS, MAX_HP, TEAM_SIZE,
  WEAPONS, player, companions,
  getStairExit:   () => stairExit,
  getRandomStair: () => randomStair,
  getElevator:    () => elevator,
  getCurrentLevel: () => currentLevel,
  isElevatorInTransition,
  say, getSubTimer,
});

// Guide ctx — stable references; per-frame the closure derefs the live
// `guide`, `stairExit`, `cells` bindings via property access.
const _guideCtx = {
  get guide()      { return guide; },
  get stairExit()  { return stairExit; },
  get cells()      { return cells; },
  controls, GRID, CELL, collide,
};

function tick() {
  const dt = Math.min(clock.getDelta(), 0.05);
  const t = clock.elapsedTime;

  // Wake-up + movement + flashlight battery — see js/player.js.
  updatePlayerWakeup(dt);
  updatePlayerMovement(dt, t);

  // Pickups + held-weapon animation — see js/pickups.js / js/weapon_anim.js.
  updatePickups(dt, t);
  updateWeaponAnim(dt, t);

  // Companions follow as a flock around the player
  const pp = controls.getObject().position;
  updateCompanions(dt, t);

  tickCompanionChatter(dt);
  _updateGuide(dt, t, _guideCtx);

  // Rocket projectiles + entity AI — see js/weapon_fx.js / js/entities.js.
  tickRockets(dt);
  tickEntities(dt, t);

  // Hazards (electric / moths / toxic) — see js/hazards.js.
  updateElectric(dt);
  updateMoths(dt);
  updateToxic(dt, t);

  updatePlayerDeath(dt);

  // Sanity / heartbeat / whispers / stair pulse — see js/atmosphere.js.
  updateAtmosphere(dt, t);

  updateHUD(dt, t, pp);
  tickElevator(dt, t);

  scene.fog.far = LEVELS[currentLevel].fogFar - (1 - player.sanity) * 10;

  tickSubtitle(dt);

  renderer.render(scene, camera);
  requestAnimationFrame(tick);
}

buildLevel(0);
tick();

// Auto-screenshot mode (see js/screenshot_mode.js).
maybeRunScreenshotMode({
  LEVELS, overlay, controls, player,
  buildLevel, isGirlLoaded, isGLTFUpgradeComplete,
});
</script>
</body>
</html>
